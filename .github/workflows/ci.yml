name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22'}
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '22'}
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - name: Unit, integration and security tests
        run: npm test
      - run: npm run doctor
      - run: npm run demo
      - name: Contract gate + independent audit report (JSON + MD + HTML)
        shell: bash
        run: |
          node src/cli/main.mjs compare --before fixtures/openapi/before.json --after fixtures/openapi/after.json --consumers fixtures/consumers/consumers.json --out ci-reports --fail-on none
          node src/cli/main.mjs audit --dir ci-reports --out audit-out
          node src/cli/main.mjs verify --report audit-out/audit-report.json
          test -f audit-out/audit-report.md && test -f audit-out/audit-report.html
          # the gate must FAIL on this fixture (it contains breaking changes): exit code 2
          set +e; node src/cli/main.mjs compare --before fixtures/openapi/before.json --after fixtures/openapi/after.json >/dev/null; code=$?; set -e
          test "$code" = "2"
      - name: Upload audit report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: |
            audit-out
            ci-reports
          retention-days: 14
  package:
    name: npm pack and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm pack --silent
      - name: Install tarball in an empty project and run through the npm bin shim
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install ../contractsutra-ai-*.tgz
          npx contractsutra --version
          npx contractsutra doctor >/dev/null
          F=node_modules/contractsutra-ai/fixtures
          npx contractsutra compare --before $F/openapi/before.json --after $F/openapi/after.json --consumers $F/consumers/consumers.json --out out --fail-on none >/dev/null
          npx contractsutra audit --dir out --out out/audit >/dev/null
          test -f out/audit/audit-report.html && test -f out/audit/audit-report.md
          npx contractsutra verify --report out/audit/audit-report.json
          npx contractsutra install-ide --host claude --target ./proj >/dev/null
  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed tokens
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|npm_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests'; then echo "Possible secret committed"; exit 1; fi
